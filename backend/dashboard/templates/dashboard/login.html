{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReportLink Admin - Sign in</title>
<link rel="icon" href="{% static 'dashboard/img/logo.png' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: white;
    border-radius: 16px;
    padding: 42px 38px;
    width: 400px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }
  .brand { text-align: center; margin-bottom: 30px; }
  .brand-logo {
    width: 96px; height: 96px;
    object-fit: contain;
    margin-bottom: 12px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .brand h1 { font-size: 24px; color: #0F172A; font-weight: 700; }
  .brand p { color: #64748B; font-size: 13px; margin-top: 4px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1.5px solid #E2E8F0; border-radius: 10px;
    transition: all 0.15s; outline: none;
  }
  input:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }
  button {
    width: 100%; padding: 13px; margin-top: 24px;
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    color: white; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .error {
    background: #FEF2F2; color: #B91C1C;
    padding: 10px 14px; border-radius: 8px;
    font-size: 13px; margin-bottom: 6px;
    border-left: 3px solid #B91C1C;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <img src="{% static 'dashboard/img/logo.png' %}" alt="ReportLink" class="brand-logo">
      <h1>ReportLink Admin</h1>
      <p>Sign in to manage reports and users</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Username</label>
      <input type="text" name="username" autofocus required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
    </form>
  </div>
</body>
</html>
